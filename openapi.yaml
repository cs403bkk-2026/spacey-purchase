openapi: 3.0.3
info:
  title: Spacey Purchase service
  description: >
    Purchase's spaces, bookings and accounts, served to the `spacey` hub.
    Only the hub calls this service; the frontend and the public API still
    go through the hub. The model is recorded in
    [ADR 0002](https://github.com/cs403bkk-2026/spacey-purchase/blob/main/docs/adr/0002-purchase-behind-the-spacey-hub.md).


    Every operation except `GET /health` needs `Authorization: Bearer
    <PURCHASE_TOKEN>`. A missing or wrong token answers 403, so the only 401
    in this contract is the one from `POST /users/authenticate`.
  version: "1.0"
servers:
  - url: http://localhost:8002
    description: The service, run locally.
  - url: https://purchase.cs403bkk26.space
    description: Production. Only the hub reaches it; `GET /health` is the one open path.

security:
  - bearerAuth: []

tags:
  - name: spaces
  - name: bookings
  - name: accounts
    description: Registration and password check.
  - name: operations
    description: Health, business metrics and test set-up.

paths:
  /health:
    get:
      tags: [operations]
      summary: Check the service and its database are reachable.
      security: []
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  revision:
                    type: string
                    description: The `APP_REVISION` environment variable, or `local` if unset.
                required: [status, revision]
              example: { status: ok, revision: local }
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [error] }
                  error: { type: string }
                required: [status, error]
              example: { status: error, error: database unreachable }

  /spaces:
    get:
      tags: [spaces]
      summary: List every space.
      description: >
        `available` normally reflects this exact instant. Pass `start_time`
        and `end_time` together to check availability for a specific window
        instead - the same back-to-back-is-fine overlap rule booking uses. A
        cancelled booking blocks no slot.
      parameters:
        - $ref: "#/components/parameters/StartTime"
        - $ref: "#/components/parameters/EndTime"
      responses:
        "200":
          description: The full space list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  spaces:
                    type: array
                    items: { $ref: "#/components/schemas/Space" }
                required: [spaces]
              example:
                spaces:
                  - id: 1
                    name: Founders Desk
                    capacity: 1
                    price_cents: 2500
                    available: true
        "400":
          $ref: "#/components/responses/BadWindow"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [spaces]
      summary: Create a space.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: Meeting Room A }
                capacity:
                  type: integer
                  minimum: 1
                  example: 6
                price_cents:
                  type: integer
                  minimum: 0
                  default: 0
                  description: >
                    Per-hour rate. A booking is charged this rate times the
                    hours booked, rounded to whole cents.
                  example: 1500
              required: [name, capacity]
      responses:
        "201":
          description: Created. The full row, as the hub's mirror copies it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceRow" }
              example:
                id: 2
                name: Meeting Room A
                capacity: 6
                price_cents: 1500
        "400":
          description: >
            `name and capacity are required` (either is missing), `name must
            not be empty`, `capacity must be a whole number of at least 1`,
            or `price_cents must be a non-negative integer`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: name and capacity are required }
        "403":
          $ref: "#/components/responses/Forbidden"

  /spaces/booked-ids:
    get:
      tags: [spaces]
      summary: List the ids of the spaces that are booked.
      description: >
        A space is booked when a pending or completed booking overlaps the
        window. A cancelled or expired booking blocks no slot. Pass
        `start_time` and `end_time` together for a specific window, or
        neither for right now. An unpaid booking counts for 15 minutes from
        its creation only (SP-R07): after that its hold has expired.
      parameters:
        - $ref: "#/components/parameters/StartTime"
        - $ref: "#/components/parameters/EndTime"
      responses:
        "200":
          description: The ids of the booked spaces.
          content:
            application/json:
              schema:
                type: object
                properties:
                  space_ids:
                    type: array
                    items: { type: integer }
                required: [space_ids]
              example: { space_ids: [1, 3] }
        "400":
          $ref: "#/components/responses/BadWindow"
        "403":
          $ref: "#/components/responses/Forbidden"

  /spaces/{spaceId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [spaces]
      summary: Get one space.
      description: Same availability rule as `GET /spaces` - pass a window, or omit both params for "right now".
      parameters:
        - $ref: "#/components/parameters/StartTime"
        - $ref: "#/components/parameters/EndTime"
      responses:
        "200":
          description: The space.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Space" }
              example:
                id: 1
                name: Founders Desk
                capacity: 1
                price_cents: 2500
                available: true
        "400":
          $ref: "#/components/responses/BadWindow"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SpaceNotFound"
    patch:
      tags: [spaces]
      summary: Update a space.
      description: >
        Only the fields present in the body are changed; everything else
        keeps its current value. Changing the price does not affect
        bookings already made at the old price (see `amount_cents` on a
        booking).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                capacity: { type: integer, minimum: 1 }
                price_cents: { type: integer, minimum: 0 }
              minProperties: 1
              example: { price_cents: 2000 }
      responses:
        "200":
          description: The updated space. The full row, as the hub's mirror copies it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceRow" }
              example:
                id: 1
                name: Founders Desk
                capacity: 1
                price_cents: 2000
        "400":
          description: >
            `provide name, capacity and/or price_cents to update` (empty
            body), or the same per-field messages as `POST /spaces`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "provide name, capacity and/or price_cents to update" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SpaceNotFound"
    delete:
      tags: [spaces]
      summary: Delete a space.
      description: >
        Refused while the space has any booking that is not cancelled, past
        or present - cancel them first. A cancelled booking does not stop
        the delete.
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SpaceNotFound"
        "409":
          description: The space still has bookings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "space has bookings, cancel them first" }

  /spaces/{spaceId}/bookings:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [bookings]
      summary: List a space's bookings.
      description: >
        The bookings that hold the space's slots. An unpaid booking older
        than 15 minutes is not listed: its hold has expired (SP-R07).
      responses:
        "200":
          description: That space's bookings, earliest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingList" }
              example:
                bookings:
                  - id: 1
                    space_id: 1
                    member: annabel
                    paid: false
                    start_time: "2030-01-01T10:00:00+00:00"
                    end_time: "2030-01-01T11:00:00+00:00"
                    amount_cents: 2500
                    user_id: 1
                    card_last4: null
                    created_at: "2026-10-12T02:48:20.933270+00:00"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SpaceNotFound"
    post:
      tags: [bookings]
      summary: Book a space.
      description: >
        Always created unpaid; a later `POST /bookings/{bookingId}/paid`
        marks it paid. A cancelled booking blocks no slot. An unpaid
        booking holds its slot for 15 minutes from creation (SP-R07). After
        that its hold has expired, and the slot can be booked again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                member:
                  type: string
                  default: guest
                  description: >
                    Stored trimmed of surrounding spaces. Defaults to
                    `guest` if omitted or blank - there is no requirement
                    yet that a real name is given.
                  example: annabel
                start_time:
                  type: string
                  format: date-time
                  description: ISO 8601 with a timezone.
                  example: "2030-01-01T10:00:00Z"
                end_time:
                  type: string
                  format: date-time
                  example: "2030-01-01T11:00:00Z"
                party_size:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Must not exceed the space's capacity.
                user_id:
                  type: integer
                  nullable: true
                  description: The account the hub has logged in, or null for a guest.
                  example: 1
              required: [start_time, end_time]
      responses:
        "201":
          description: Booked. The full row, as the hub's mirror copies it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
              example:
                id: 1
                space_id: 1
                member: annabel
                paid: false
                start_time: "2030-01-01T10:00:00+00:00"
                end_time: "2030-01-01T11:00:00+00:00"
                amount_cents: 2500
                user_id: 1
                card_last4: null
                created_at: "2026-10-12T02:48:20.933270+00:00"
        "400":
          description: >
            `start_time and end_time are required (ISO 8601 with
            timezone)`, `end_time must be after start_time`, `party_size
            must be a whole number of at least 1`, `party_size {n}
            exceeds this space's capacity of {capacity}`, `member must be
            a string`, `user_id must be a whole number or null`, or
            `user_id is not a known account`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "start_time and end_time are required (ISO 8601 with timezone)" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SpaceNotFound"
        "409":
          description: The space is already booked for an overlapping time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "space is already booked for that time" }

  /bookings:
    get:
      tags: [bookings]
      summary: List every booking, across all spaces.
      description: A cancelled booking is not listed.
      responses:
        "200":
          description: Every booking, earliest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingList" }
              example:
                bookings:
                  - id: 1
                    space_id: 1
                    member: annabel
                    paid: true
                    start_time: "2030-01-01T10:00:00+00:00"
                    end_time: "2030-01-01T11:00:00+00:00"
                    amount_cents: 2500
                    user_id: 1
                    card_last4: "4242"
                    created_at: "2026-10-12T02:48:20.933270+00:00"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{userId}/bookings:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [bookings]
      summary: List one account's bookings.
      description: >
        Bookings made with that `user_id`; guest bookings (`user_id` null)
        are never included. A cancelled booking is not listed. An unknown
        user has none.
      responses:
        "200":
          description: That account's bookings, earliest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingList" }
              example:
                bookings:
                  - id: 1
                    space_id: 1
                    member: annabel
                    paid: false
                    start_time: "2030-01-01T10:00:00+00:00"
                    end_time: "2030-01-01T11:00:00+00:00"
                    amount_cents: 2500
                    user_id: 1
                    card_last4: null
                    created_at: "2026-10-12T02:48:20.933270+00:00"
        "403":
          $ref: "#/components/responses/Forbidden"

  /bookings/{bookingId}:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    get:
      tags: [bookings]
      summary: Get one booking.
      responses:
        "200":
          description: The booking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
              example:
                id: 1
                space_id: 1
                member: annabel
                paid: false
                start_time: "2030-01-01T10:00:00+00:00"
                end_time: "2030-01-01T11:00:00+00:00"
                amount_cents: 2500
                user_id: 1
                card_last4: null
                created_at: "2026-10-12T02:48:20.933270+00:00"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
    delete:
      tags: [bookings]
      summary: Cancel a booking.
      description: >
        Soft: the booking is kept but cancelled, whether or not it was
        paid. It then reads as 404, is not listed or counted, and blocks no
        slot. Cancelling again answers 404.
      responses:
        "200":
          description: The booking as it was just before the cancel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
              example:
                id: 1
                space_id: 1
                member: annabel
                paid: true
                start_time: "2030-01-01T10:00:00+00:00"
                end_time: "2030-01-01T11:00:00+00:00"
                amount_cents: 2500
                user_id: 1
                card_last4: "4242"
                created_at: "2026-10-12T02:48:20.933270+00:00"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"

  /bookings/{bookingId}/paid:
    post:
      tags: [bookings]
      summary: Mark a booking paid.
      description: >
        Records that the hub charged the card. Only the card's last 4
        digits are ever sent, stored or returned. Marking an already-paid
        booking answers the stored row and keeps the first card, so a
        retried request changes nothing. A success that arrives after the
        15-minute hold is confirmed while the slot is still free. If another
        booking took the slot, the answer is 409 and the booking stays
        unpaid.
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                card_last4:
                  type: string
                  pattern: "^[0-9]{4}$"
                  example: "4242"
              required: [card_last4]
              additionalProperties: false
      responses:
        "200":
          description: Paid (or already was). The full row, as the hub's mirror copies it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
              example:
                id: 1
                space_id: 1
                member: annabel
                paid: true
                start_time: "2030-01-01T10:00:00+00:00"
                end_time: "2030-01-01T11:00:00+00:00"
                amount_cents: 2500
                user_id: 1
                card_last4: "4242"
                created_at: "2026-10-12T02:48:20.933270+00:00"
        "400":
          description: The body has a key other than `card_last4`, or `card_last4` is not 4 digits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "send only card_last4, as 4 digits" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409": { $ref: "#/components/responses/HoldExpired" }

  /bookings/{bookingId}/payable:
    get:
      tags: [bookings]
      summary: Check that a booking can be paid.
      description: >
        Called before the card is charged. 409 means the 15-minute hold has
        expired, so do not charge.
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: The booking's amount and status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  amount_cents: { type: integer }
                  status: { type: string, enum: [pending, completed] }
                required: [id, amount_cents, status]
              example: { id: 1, amount_cents: 2500, status: pending }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409": { $ref: "#/components/responses/HoldExpired" }

  /bookings/{bookingId}/unlockable:
    get:
      tags: [bookings]
      summary: Check that a booking may be unlocked.
      description: Called before an access code is issued.
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "204":
          description: The booking is paid (`completed`), so it may be unlocked. No body.
        "402":
          description: The booking is not paid yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: booking is not paid }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BookingNotFound"

  /register:
    post:
      tags: [accounts]
      summary: Create an account.
      description: >
        Email is matched trimmed and lower-cased, and must be unique. The
        password is hashed (werkzeug.security) and never stored or returned
        as plain text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, example: annabel@example.com }
                password:
                  type: string
                  minLength: 8
                  example: hunter22
              required: [email, password]
      responses:
        "201":
          description: Registered. The row, as the hub's mirror copies it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
              example: { id: 1, email: annabel@example.com }
        "400":
          description: >
            enter a valid email address, or password must be at least 8
            characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: enter a valid email address }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: That email is already registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "email is already registered" }

  /users/authenticate:
    post:
      tags: [accounts]
      summary: Check an email and password.
      description: >
        A wrong password and an unknown email return the identical error, so
        an attempt can't be used to find out which emails are registered.
        No session is started: the hub keeps it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, example: annabel@example.com }
                password: { type: string, example: hunter22 }
              required: [email, password]
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
              example: { id: 1, email: annabel@example.com }
        "401":
          description: Wrong password, or no account with that email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: invalid email or password }
        "403":
          $ref: "#/components/responses/Forbidden"

  /metrics:
    get:
      tags: [operations]
      summary: Business metrics, as JSON.
      description: >-
        The service's own business totals, for machine consumption. The
        external Grafana business metrics report is reconciled against these
        values. A cancelled booking is not counted.
      responses:
        "200":
          description: Current totals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  spaces: { type: integer }
                  bookings:
                    type: integer
                    description: paid_bookings + unpaid_bookings.
                  paid_bookings: { type: integer }
                  unpaid_bookings: { type: integer }
                  members:
                    type: integer
                    description: Distinct member strings that have ever booked.
                  revenue_cents:
                    type: integer
                    description: >
                      Sum of amount_cents across paid bookings only - the
                      price each was actually charged at booking time, not
                      today's space price.
                  utilization:
                    type: number
                    description: >
                      Booked hours over the next 7 days as a share of
                      available hours (spaces x 7 x 24), 0 if there are no
                      spaces. Counts every booking that holds its slot (pending or completed), paid or not - this measures usage, not revenue.
                    example: 0.15
                  repeat_member_rate:
                    type: number
                    description: >
                      Share of members (by the free-text member string)
                      with more than one booking, 0 if there are no
                      bookings.
                    example: 0.25
                  payment_conversion:
                    type: number
                    description: Share of bookings that were paid, 0 if there are no bookings.
                    example: 0.67
                  avg_revenue_cents_per_paid_booking:
                    type: integer
                    description: revenue_cents divided by paid_bookings, rounded; 0 if none are paid.
                    example: 1500
                  revenue_by_space:
                    type: array
                    description: One row per space, even one with no bookings at all.
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        revenue_cents: { type: integer }
                      required: [id, name, revenue_cents]
                required:
                  [
                    spaces, bookings, paid_bookings, unpaid_bookings, members,
                    revenue_cents, utilization, repeat_member_rate,
                    payment_conversion, avg_revenue_cents_per_paid_booking,
                    revenue_by_space,
                  ]
              example:
                spaces: 1
                bookings: 2
                paid_bookings: 1
                unpaid_bookings: 1
                members: 1
                revenue_cents: 2500
                utilization: 0.01
                repeat_member_rate: 1
                payment_conversion: 0.5
                avg_revenue_cents_per_paid_booking: 2500
                revenue_by_space:
                  - id: 1
                    name: Founders Desk
                    revenue_cents: 2500
        "403":
          $ref: "#/components/responses/Forbidden"

  /test/reset:
    post:
      tags: [operations]
      summary: Empty every Purchase table, for tests.
      description: >
        Exists only when `PURCHASE_TEST_RESET=1`. Every Purchase table is
        emptied and its ids restart. The starter space (Founders Desk, 2500
        cents per hour) is added again when `SEED_STARTER_SPACE=true`.
      responses:
        "204":
          description: Reset.
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The `PURCHASE_TOKEN` the hub and the service share.

  parameters:
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: integer }
      example: 1
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: integer }
      example: 1
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer }
      example: 1
    StartTime:
      name: start_time
      in: query
      required: false
      description: Required together with end_time; ISO 8601 with a timezone.
      schema: { type: string, format: date-time }
      example: "2026-09-25T09:00:00Z"
    EndTime:
      name: end_time
      in: query
      required: false
      description: Required together with start_time; must be after it.
      schema: { type: string, format: date-time }
      example: "2026-09-25T10:00:00Z"

  responses:
    Forbidden:
      description: The bearer token is missing or wrong.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: invalid service token }
    SpaceNotFound:
      description: No space with that id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "space not found" }
    BookingNotFound:
      description: No booking with that id, or it is cancelled.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "booking not found" }
    HoldExpired:
      description: >
        The booking is unpaid and older than 15 minutes (SP-R07): its hold has
        expired. On `/paid`, another booking has taken the slot.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "booking hold has expired" }
    BadWindow:
      description: >
        start_time/end_time were not given together, aren't valid ISO 8601
        with a timezone, or end_time is not after start_time.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: >-
              start_time and end_time must be given together (ISO 8601 with
              timezone, e.g. 2026-09-25T09:00:00Z)

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    SpaceRow:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Founders Desk }
        capacity: { type: integer, example: 1 }
        price_cents:
          type: integer
          example: 2500
          description: Per-hour rate in cents.
      required: [id, name, capacity, price_cents]

    Space:
      allOf:
        - $ref: "#/components/schemas/SpaceRow"
        - type: object
          properties:
            available:
              type: boolean
              description: >
                Whether the space is free right now, or for the requested
                start_time/end_time window if one was given.
          required: [available]

    Booking:
      type: object
      properties:
        id: { type: integer, example: 1 }
        space_id: { type: integer, example: 1 }
        member: { type: string, example: annabel }
        paid:
          type: boolean
          description: True when the booking is completed (paid).
        start_time: { type: string, format: date-time, example: "2026-09-25T02:00:00+00:00" }
        end_time: { type: string, format: date-time, example: "2026-09-25T03:00:00+00:00" }
        amount_cents:
          type: integer
          description: >
            What this booking was actually charged: the space's per-hour
            rate times the hours booked, fixed at the price when it was
            made - a later price change does not affect it. 0 on old
            bookings a subscription covered.
          example: 1500
        user_id:
          type: integer
          nullable: true
          description: >
            The account that was logged in when the booking was made, or
            null for a guest booking made while logged out.
          example: 1
        card_last4:
          type: string
          nullable: true
          description: >
            The last 4 digits of the card used to pay. Null until the
            booking is paid; the full card number and CVC are never stored
            or returned.
          example: "4242"
        created_at:
          type: string
          format: date-time
          description: >
            When the booking was made - not when the space is used, which is
            start_time. Set by the database.
          example: "2026-09-24T02:48:20.933270+00:00"
      required: [id, space_id, member, paid, start_time, end_time, amount_cents, user_id, card_last4, created_at]

    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        email: { type: string, format: email, example: annabel@example.com }
      required: [id, email]

    BookingList:
      type: object
      properties:
        bookings:
          type: array
          items: { $ref: "#/components/schemas/Booking" }
      required: [bookings]
