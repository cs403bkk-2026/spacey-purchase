[project]
name = "spacey-purchase"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.2",
    "gunicorn==23.0.0",
    "psycopg[binary]==3.2.13",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff>=0.16.10",
]

[tool.ruff]
# Plain copies of spacey, deleted by PUR-002.
extend-exclude = ["spacey_app.py", "tests/spacey_test_app.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "ERA", "N", "PTH", "RET", "SIM"]

[tool.ruff.lint.isort]
# Not in this repo yet, but imported as our own code.
known-first-party = ["payment", "shared"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
